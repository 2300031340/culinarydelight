apiVersion: v1
kind: Secret
metadata:
  name: recipe-app-secrets
  namespace: recipe-app
type: Opaque
stringData:
  # MongoDB connection string - Update this with your actual MongoDB URI
  MONGODB_URI: "mongodb://mongodb-service:27017/recipe-app"
  # JWT Secret - Update this with a strong secret
  JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production"
  # Add other secrets as needed
  # EMAIL_PASSWORD: "your-email-password"

---
# Note: In production, use sealed-secrets or external secret management
# To create this secret manually:
# kubectl create secret generic recipe-app-secrets \
#   --from-literal=MONGODB_URI='mongodb://mongodb-service:27017/recipe-app' \
#   --from-literal=JWT_SECRET='your-secret-key' \
#   --namespace=recipe-app

